<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="theme-color" content="#F7F6F2">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${title} · xkgc__</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23D94F2A'/%3E%3Cpath d='m20 20 24 24m0-24L20 44' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="../editorial.css">
    <link rel="stylesheet" href="../article.css">
    <link rel="stylesheet" href="../dark-theme.css">
    <script defer src="../theme.js"></script>
  </head>
  <body id="top">
    <a class="skip-link" href="#article">跳到文章</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="../index.html" class="brand" aria-label="xkgc__ 返回主页">
        <span class="brand-mark" aria-hidden="true">×</span>
        <span>xkgc__</span>
      </a>

      <nav class="nav-links" aria-label="主导航">
        <a class="nav-link" href="../index.html">Home</a>
        <a class="nav-link" href="../about.html">About</a>
        <a class="nav-link" href="../publications.html">Publications</a>
        <a class="nav-link" href="../projects.html">Projects</a>
        <a class="nav-link" href="../blog.html" aria-current="page">Blog</a>
        <a class="nav-link" href="../index.html#contact">Contact</a>
      </nav>

      <div class="topbar-tools">
        <button type="button" class="tool-btn icon-only theme-toggle" id="theme-toggle-btn" aria-label="切换明暗主题" title="切换明暗主题"></button>
      </div>
    </div>
  </header>
    <main class="reading-layout" id="article">
      <div class="reading-content">
        <a class="back-link" href="../blog.html">返回博客</a>
        <article id="post-content">
          <header class="article-header"><p class="category">${category}</p><h1>${title}</h1><div class="meta"><time datetime="${date}">${date}</time><span class="tags">${tags}</span></div></header>
          <div class="prose">${body}</div>
        </article>
        <a class="back-link bottom-link" href="../blog.html">返回博客列表</a>
      </div>
      <aside class="reading-sidebar" aria-label="文章目录与阅读进度">
        <div class="toc-heading"><h2>本文目录</h2><span>${section_count} 个章节</span></div>
        <nav class="toc-nav" aria-label="本文目录"><ol class="toc-list">${toc}</ol></nav>
        <div class="reading-progress">
          <span id="progress-label">已读 0%</span>
          <a href="#top">返回开头</a>
          <div class="progress-track" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
        </div>
      </aside>
    </main>
  <footer class="site-footer"><div class="container footer-inner">
    <span class="mono">© xkgc__</span>
    <div class="footer-links"><a class="footer-link" href="../index.html">返回主页</a><a class="footer-link" href="#top">返回顶部</a></div>
  </div></footer>
    <script src="../article.js" defer></script>
  </body>
</html>
