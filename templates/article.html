<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="${summary}">
    <title>${title} · xkgc__</title>
    <link rel="stylesheet" href="../article.css">
  </head>
  <body id="top">
    <a class="skip-link" href="#article">跳到文章</a>
    <header class="header"><div class="container header-inner"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">×</span>xkgc__</a><nav aria-label="主导航"><a href="../index.html">首页</a><a href="../about.html">关于</a><a href="../blog.html" aria-current="page">博客</a></nav></div></header>
    <main class="reading-layout" id="article">
      <div class="reading-content">
        <a class="back-link" href="../blog.html">← 返回博客</a>
        <article id="post-content">
          <header class="article-header"><p class="category">${category}</p><h1>${title}</h1><p class="summary">${summary}</p><div class="meta"><time datetime="${date}">${date}</time><span class="tags">${tags}</span></div></header>
          <div class="prose">${body}</div>
        </article>
        <a class="back-link bottom-link" href="../blog.html">← 返回博客列表</a>
      </div>
      <aside class="reading-sidebar" aria-label="文章目录与阅读进度">
        <div class="toc-heading"><h2>本文目录</h2><span>${section_count} 个章节</span></div>
        <nav class="toc-nav" aria-label="本文目录"><ol class="toc-list">${toc}</ol></nav>
        <div class="reading-progress">
          <span id="progress-label">已读 0%</span>
          <a href="#top">返回开头 ↑</a>
          <div class="progress-track" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
        </div>
      </aside>
    </main>
    <footer><div class="container footer-inner"><span>© xkgc__</span><a href="../index.html">返回个人主页 ↗</a></div></footer>
    <script src="../article.js" defer></script>
  </body>
</html>
