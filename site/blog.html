    <section class="series-card" id="agent-series" aria-labelledby="series-title" hidden>
      <div class="series-top">
        <span class="series-badge"><span class="dot" aria-hidden="true"></span><span id="series-count"></span></span>

    </section>
    <noscript><p>请启用 JavaScript，以加载文章列表并使用分类和搜索。</p></noscript>

      <div class="filter-pills" id="category-list" role="group" aria-label="按分类筛选文章"></div>

        <kbd class="kbd-cap" aria-hidden="true">/</kbd>
      </form>
    </section>
    <section aria-labelledby="results-title">
      <div class="group-header">
        <div class="group-month"><span class="dot" aria-hidden="true"></span><h2 id="results-title" tabindex="-1">全部文章</h2></div>
        <div class="result-status" id="result-count" role="status" aria-live="polite">正在加载…</div>

      <div class="empty-state" id="empty-state">
        <svg style="margin:0 auto" width="38" height="38" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="5" width="17" height="23" rx="3"/><path d="M13 12h7M13 17h7M13 22h4M5 8v15"/></svg>

        <p class="empty-desc" id="empty-description">学习与实践的记录，会陆续更新在这里。</p>
        <button class="reset-btn" id="reset-filters" type="button" hidden>查看全部文章</button>
